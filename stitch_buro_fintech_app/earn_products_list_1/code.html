<!DOCTYPE html>

<style>
        body {
            background-color: #FDFCF9; /* Using requested hex, falling back to surface from config where needed */
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .artboard {
            width: 393px;
            height: 852px;
            background-color: #FDFCF9;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        /* Hide scrollbar for cleaner look */
        .artboard::-webkit-scrollbar { display: none; }
        .artboard { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-on-surface font-body-md">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-background text-primary dark:text-inverse-primary border-b border-outline-variant dark:border-on-primary-container/10 flex justify-between items-center w-full px-container-margin h-16 sticky top-0 z-40">
<button class="hover:opacity-70 transition-opacity flex items-center justify-center p-2 rounded-full hover:bg-surface-variant/50">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-heading-md text-heading-md font-bold tracking-tight text-primary dark:text-inverse-primary">Boro</h1>
<button class="hover:opacity-70 transition-opacity flex items-center justify-center p-2 rounded-full hover:bg-surface-variant/50">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">more_vert</span>
</button>
</header>
<div class="artboard mx-auto pb-32">
<!-- Main Content Canvas -->
<main class="px-container-margin pt-8 flex flex-col gap-8">
<!-- Earn Header Section -->
<section class="flex flex-col gap-6">
<!-- Title Row -->
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined">trending_up</span>
</div>
<h2 class="font-heading-md text-[22px] font-[650] tracking-tight">Earn</h2>
</div>
<!-- Balance Data -->
<div class="flex flex-col gap-2">
<p class="font-label-sm text-on-surface-variant uppercase tracking-wider">Balance · APY 0.00%</p>
<div class="flex items-baseline">
<span class="font-display-lg text-[50px] font-semibold text-primary tracking-tighter leading-none">$0</span>
<span class="font-display-lg text-[50px] font-semibold text-outline tracking-tighter leading-none">.00</span>
</div>
</div>
</section>
<!-- Summary Cards Bento -->
<section class="grid grid-cols-2 gap-4">
<div class="bg-surface-container-lowest rounded-lg p-5 border border-outline-variant/30 flex flex-col justify-between h-[96px] shadow-[0_2px_8px_rgba(0,0,0,0.02)]">
<p class="font-label-sm text-on-surface-variant">Lifetime Earned</p>
<p class="font-numeric-data text-numeric-data text-primary">$0.00</p>
</div>
<div class="bg-surface-container-lowest rounded-lg p-5 border border-outline-variant/30 flex flex-col justify-between h-[96px] shadow-[0_2px_8px_rgba(0,0,0,0.02)]">
<p class="font-label-sm text-on-surface-variant">Last 7D</p>
<p class="font-numeric-data text-numeric-data text-primary">+$0.00</p>
</div>
</section>
<!-- Promo Card -->
<section class="bg-primary rounded-[22px] p-6 text-on-primary flex items-center justify-between relative overflow-hidden shadow-sm">
<!-- Abstract dark background elements -->
<div class="absolute inset-0 opacity-20 bg-gradient-to-br from-tertiary-container to-primary pointer-events-none"></div>
<div class="relative z-10 flex flex-col gap-2">
<h3 class="font-body-lg text-body-lg font-semibold tracking-tight">Get Boro Plus</h3>
<p class="font-body-md text-body-md text-inverse-primary/80">Deposit $100+ to unlock higher yields.</p>
</div>
<div class="relative z-10 bg-on-primary/10 rounded-full p-3 backdrop-blur-sm">
<span class="material-symbols-outlined text-on-primary">arrow_forward</span>
</div>
</section>
<!-- Available Products List -->
<section class="flex flex-col gap-5 pt-4">
<h2 class="font-heading-md text-[22px] font-[650] tracking-tight">Available products</h2>
<!-- Product Card 1 -->
<div class="bg-surface-container-lowest rounded-[22px] p-5 border border-outline-variant/30 flex items-center gap-4 shadow-[0_2px_8px_rgba(0,0,0,0.02)] hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="w-14 h-14 rounded-full bg-surface-variant flex items-center justify-center shrink-0 overflow-hidden border border-outline-variant/20">
<img alt="Product logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0ui2sIU56gRu4HQt7EYwZR9lhh98ysFIc8xVZ9BPxgM53vSqPmOflIJJLTzXwDNI5YvBkNX24UFRy1BDRuz7pNDuWgCF34aV2mrsoBYCKhAhtytTWwjzCGOUpO_-7Oox6olpDzIOCnggZT6F0NEdDHQCxzOyCiS72Ko993KoQjctJfodZRBGA3Aq3KbhjvZOd5eK3R_kQ6cu1-GnpufRpXdGgIKaZZs2iOPCu3i3IccWSZqlDKflCLUeemj7"/>
</div>
<div class="flex flex-col flex-grow gap-1">
<div class="flex justify-between items-baseline">
<h3 class="font-body-lg text-[18px] font-semibold text-primary">Kamino</h3>
<span class="font-numeric-data text-[16px] text-secondary">7.99% APY</span>
</div>
<p class="font-body-md text-sm text-on-surface-variant">Lending Yield</p>
</div>
</div>
<!-- Product Card 2 (Placeholder for list flow) -->
<div class="bg-surface-container-lowest rounded-[22px] p-5 border border-outline-variant/30 flex items-center gap-4 shadow-[0_2px_8px_rgba(0,0,0,0.02)] hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="w-14 h-14 rounded-full bg-surface-variant flex items-center justify-center shrink-0 overflow-hidden border border-outline-variant/20">
<div class="w-full h-full bg-tertiary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[24px]">water_drop</span>
</div>
</div>
<div class="flex flex-col flex-grow gap-1">
<div class="flex justify-between items-baseline">
<h3 class="font-body-lg text-[18px] font-semibold text-primary">Meteora</h3>
<span class="font-numeric-data text-[16px] text-secondary">5.20% APY</span>
</div>
<p class="font-body-md text-sm text-on-surface-variant">Liquidity Pool</p>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Shell & Floating Action -->
<!-- Wrapping in a fixed container constrained to artboard width -->
<div class="absolute bottom-0 left-0 w-full pb-8 pt-4 px-container-margin bg-gradient-to-t from-[#FDFCF9] via-[#FDFCF9]/90 to-transparent pointer-events-none z-50 flex flex-col items-center gap-4">
<!-- Contextual Floating Action Container -->
<div class="w-full flex justify-between items-center pointer-events-auto">
<!-- Back Circle -->
<button class="w-[56px] h-[56px] rounded-full bg-surface-container-lowest border border-outline-variant/30 shadow-sm flex items-center justify-center hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
<!-- Center Pill Action -->
<div class="bg-surface-container-lowest/90 backdrop-blur-md rounded-full border border-outline-variant/50 p-1.5 flex items-center shadow-sm max-w-[200px]">
<button class="bg-primary text-on-primary font-label-sm px-6 py-3 rounded-full transition-transform hover:scale-95">
                        Deposit
                    </button>
<button class="text-on-surface-variant font-label-sm px-6 py-3 rounded-full hover:bg-surface-variant/50 transition-colors">
                        Withdraw
                    </button>
</div>
</div>
</div>
</div>
