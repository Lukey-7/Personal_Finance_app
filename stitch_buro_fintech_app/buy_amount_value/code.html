<!DOCTYPE html>

<style>
        body { background-color: #FDFCFB; }
        .blinking-cursor {
            display: inline-block;
            width: 4px;
            height: 70px;
            background-color: theme('colors.primary-container');
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 8px;
            border-radius: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-main text-on-surface antialiased bg-[#FDFCFB]">
<!-- Top AppBar (Linear flow, no nav shell) -->
<header class="flex items-center justify-between px-page-margin py-row-padding sticky top-0 bg-[#FDFCFB] z-10">
<button class="w-10 h-10 flex items-center justify-center -ml-2 text-on-surface hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">arrow_back</span>
</button>
<div class="px-4 py-1.5 rounded-full border border-outline-variant/30 flex items-center gap-2">
<span class="font-label-muted text-label-muted text-on-surface">One-time order</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">expand_more</span>
</div>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Segmented Control -->
<div class="px-page-margin mt-element-gap">
<div class="flex p-1 bg-surface-container-low rounded-full">
<button class="flex-1 py-2 bg-on-surface text-on-primary rounded-full font-button-label text-button-label shadow-sm transition-all">Buy</button>
<button class="flex-1 py-2 text-on-surface-variant font-button-label text-button-label hover:text-on-surface transition-all">Sell</button>
<button class="flex-1 py-2 text-on-surface-variant font-button-label text-button-label hover:text-on-surface transition-all">Convert</button>
</div>
</div>
<!-- Main Input Area -->
<main class="flex-1 flex flex-col px-page-margin pt-section-gap">
<!-- Numerical Input -->
<div class="flex flex-col items-center justify-center flex-1 min-h-[200px]">
<div class="flex items-baseline justify-center relative">
<span class="font-display-numeric text-display-numeric text-on-surface tracking-tighter">5</span>
<div class="blinking-cursor hidden"></div>
<span class="text-[78px] leading-none tracking-tighter text-outline ml-4 font-normal">SGD</span>
<span class="material-symbols-outlined text-primary-container absolute -right-12 bottom-4" style="font-variation-settings: 'wght' 300, 'FILL' 1;">swap_vert</span>
</div>
<!-- Conversion Pill -->
<div class="mt-element-gap px-4 py-2 rounded-full bg-primary-container/5 border border-primary-container/10 flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-primary-container">swap_vert</span>
<span class="font-body-main text-body-main text-primary-container font-medium">0.00004884 BTC</span>
</div>
</div>
<!-- Transaction Details Rows -->
<div class="mt-section-gap relative">
<!-- Vertical Connector Line -->
<div class="absolute left-[23px] top-[40px] bottom-[40px] w-[1px] bg-outline-variant/30 z-0"></div>
<!-- Pay with Row -->
<div class="flex items-center gap-4 py-row-padding bg-[#FDFCFB] relative z-10">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center shrink-0 border border-outline-variant/20">
<span class="font-button-label text-button-label text-on-surface">S$</span>
</div>
<div class="flex-1">
<p class="font-label-muted text-label-muted text-on-surface-variant mb-0.5">Pay with</p>
<p class="font-body-main text-body-main text-on-surface font-medium">SGD Wallet</p>
</div>
<div class="text-right">
<p class="font-body-main text-body-main text-on-surface">S$ 1,240.50</p>
<span class="material-symbols-outlined text-[20px] text-on-surface-variant mt-1">chevron_right</span>
</div>
</div>
<!-- Buy Row -->
<div class="flex items-center gap-4 py-row-padding bg-[#FDFCFB] relative z-10">
<div class="w-12 h-12 rounded-full overflow-hidden shrink-0 border border-outline-variant/20">
<img alt="Bitcoin logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0ui2sIU56gRu4HQt7EYwZR9lhh98ysFIc8xVZ9BPxgM53vSqPmOflIJJLTzXwDNI5YvBkNX24UFRy1BDRuz7pNDuWgCF34aV2mrsoBYCKhAhtytTWwjzCGOUpO_-7Oox6olpDzIOCnggZT6F0NEdDHQCxzOyCiS72Ko993KoQjctJfodZRBGA3Aq3KbhjvZOd5eK3R_kQ6cu1-GnpufRpXdGgIKaZZs2iOPCu3i3IccWSZqlDKflCLUeemj7"/>
</div>
<div class="flex-1">
<p class="font-label-muted text-label-muted text-on-surface-variant mb-0.5">Buy</p>
<p class="font-body-main text-body-main text-on-surface font-medium">Bitcoin</p>
</div>
<div class="text-right flex items-center">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">chevron_right</span>
</div>
</div>
</div>
<!-- Sparse Keypad -->
<div class="grid grid-cols-3 gap-y-6 gap-x-4 mt-8 pb-32">
<button class="py-4 text-[28px] font-medium text-on-surface hover:opacity-70 transition-opacity">1</button>
<button class="py-4 text-[28px] font-medium text-on-surface hover:opacity-70 transition-opacity">2</button>
<button class="py-4 text-[28px] font-medium text-on-surface hover:opacity-70 transition-opacity">3</button>
<button class="py-4 text-[28px] font-medium text-on-surface hover:opacity-70 transition-opacity">4</button>
<button class="py-4 text-[28px] font-medium text-on-surface hover:opacity-70 transition-opacity">5</button>
<button class="py-4 text-[28px] font-medium text-on-surface hover:opacity-70 transition-opacity">6</button>
<button class="py-4 text-[28px] font-medium text-on-surface hover:opacity-70 transition-opacity">7</button>
<button class="py-4 text-[28px] font-medium text-on-surface hover:opacity-70 transition-opacity">8</button>
<button class="py-4 text-[28px] font-medium text-on-surface hover:opacity-70 transition-opacity">9</button>
<button class="py-4 text-[28px] font-medium text-on-surface hover:opacity-70 transition-opacity">.</button>
<button class="py-4 text-[28px] font-medium text-on-surface hover:opacity-70 transition-opacity">0</button>
<button class="py-4 flex justify-center items-center text-on-surface hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'wght' 300;">backspace</span>
</button>
</div>
</main>
<!-- Floating Pill Button -->
<div class="fixed bottom-safe-area-bottom left-0 right-0 px-page-margin z-50 pointer-events-none">
<button class="w-full bg-primary-container text-on-primary py-4 rounded-full font-button-label text-button-label shadow-[0_8px_32px_rgba(0,0,255,0.08)] pointer-events-auto hover:opacity-90 transition-opacity active:scale-[0.98]">
            Review order
        </button>
</div>
</body></html>
