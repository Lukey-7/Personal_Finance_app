<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Boro - Market Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "inverse-surface": "#2f2f3b",
                        "surface-container-high": "#e8e6f6",
                        "on-secondary-fixed-variant": "#474646",
                        "secondary-fixed": "#e5e2e1",
                        "primary-container": "#0000ff",
                        "on-tertiary-fixed-variant": "#930002",
                        "tertiary-fixed": "#ffdad5",
                        "on-surface-variant": "#454558",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#e5e2e1",
                        "surface-container-highest": "#e3e1f1",
                        "on-tertiary-container": "#ffa598",
                        "secondary-fixed-dim": "#c9c6c5",
                        "surface-container-low": "#f5f2ff",
                        "inverse-primary": "#bec2ff",
                        "primary-fixed": "#e0e0ff",
                        "on-primary-container": "#b3b7ff",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "tertiary-container": "#9d0002",
                        "tertiary": "#720001",

                        "surface": "#fbf8ff",

                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#00006e",
                        "primary-fixed-dim": "#bec2ff",
                        "on-surface": "#1a1b26",
                        "surface-variant": "#e3e1f1",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#410000",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-background": "#1a1b26",
                        "error-container": "#ffdad6",
                        "outline": "#757589",
                        "inverse-on-surface": "#f1efff",
                        "outline-variant": "#c5c4db",
                        "surface-bright": "#fbf8ff",
                        "on-secondary-container": "#656464",
                        "on-secondary": "#ffffff",
                        "surface-container": "#eeecfc",
                        "primary": "#0001bb",
                        "surface-dim": "#dad8e8",
                        "background": "#fbf8ff",

                    "borderRadius": {
                        "DEFAULT": "1rem",

                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack_md": "16px",
                        "stack_sm": "8px",
                        "stack_lg": "24px",
                        "horizontal_padding": "24px",
                        "stack_xl": "32px",
                        "base_unit": "8px"
                    },
                    "fontFamily": {
                        "keypad-number": ["Inter"],
                        "input-number": ["Inter"],
                        "row-title": ["Inter"],
                        "button-primary": ["Inter"],
                        "input-suffix": ["Inter"],
                        "body-label": ["Inter"],
                        "small-label": ["Inter"],
                        "row-subtitle": ["Inter"],
                        "row-value": ["Inter"],
                        "status-time": ["Inter"],
                        "nav-title": ["Inter"],
                        "portfolio-balance": ["Inter"]

                    "fontSize": {
                        "keypad-number": ["28px", { "lineHeight": "34px", "fontWeight": "400" }],
                        "input-number": ["64px", { "letterSpacing": "-0.055em", "fontWeight": "600" }],
                        "row-title": ["15px", { "lineHeight": "20px", "fontWeight": "650" }],
                        "button-primary": ["15px", { "lineHeight": "20px", "fontWeight": "650" }],

                }
            }
        }

<style>
        .chart-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 0;
            animation: draw 2s ease-out forwards;
        }
        @keyframes draw {
            from { stroke-dashoffset: 1000; }
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-label text-body-label pb-[75px]">
<!-- Top Navigation / Status Area -->
<header class="px-horizontal_padding pt-stack_sm pb-stack_md flex items-center justify-between sticky top-0 bg-background z-10">
<!-- Status Time (Mocked) -->
<div class="font-status-time text-status-time w-[54px]">
            9:41
        </div>
<!-- Search Pill -->
<div class="flex-1 max-w-[180px] mx-auto">
<div class="bg-surface-container-high h-[34px] rounded-full flex items-center px-4 cursor-text hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant mr-2">search</span>
<span class="text-[13px] text-on-surface-variant">Search</span>
</div>
</div>
<!-- Right Actions -->
<div class="flex items-center gap-stack_sm w-[54px] justify-end">
<button class="text-on-surface hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[24px]">redeem</span>
</button>
<button class="text-on-surface hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[24px]">notifications</span>
</button>
</div>
</header>
<!-- Main Scrollable Canvas -->
<main class="flex-1 flex flex-col px-horizontal_padding gap-stack_xl mt-stack_sm">
<!-- Balance Section -->
<section class="flex flex-col items-center justify-center pt-stack_md">
<h2 class="font-small-label text-small-label text-on-surface-variant uppercase mb-1">Total Balance</h2>
<div class="font-portfolio-balance text-portfolio-balance text-on-surface mb-2">
                S$16.58
            </div>
<div class="flex items-center gap-1 text-primary-container font-small-label text-small-label">
<span class="material-symbols-outlined text-[14px]">arrow_outward</span>
<span>+S$0.12 (0.75%)</span>
</div>
</section>
<!-- Chart Section -->
<section class="h-[140px] w-full relative">
<!-- Simulated Line Chart with SVG -->
<svg class="w-full h-full" preserveaspectratio="none" viewbox="0 0 327 140">
<defs>
<lineargradient id="chartGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#0000ff" stop-opacity="0.15"></stop>
<stop offset="100%" stop-color="#0000ff" stop-opacity="0"></stop>
</lineargradient>
</defs>
<path d="M0 140 L0 80 Q 40 60, 80 90 T 160 70 T 240 50 T 327 20 L327 140 Z" fill="url(#chartGradient)"></path>
<path class="chart-path" d="M0 80 Q 40 60, 80 90 T 160 70 T 240 50 T 327 20" fill="none" stroke="#0000ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<!-- Floating Tooltip Example -->
<div class="absolute top-[20px] right-[40px] bg-surface shadow-md rounded-lg px-3 py-1 flex items-center gap-2 border border-surface-variant">
<div class="w-2 h-2 rounded-full bg-primary-container"></div>
<span class="font-small-label text-small-label text-on-surface">S$16.58</span>
</div>
</section>
<!-- Time Selector -->
<section class="flex justify-center gap-2">
<button class="px-4 py-1.5 rounded-full font-small-label text-small-label text-primary-container bg-primary-fixed">1D</button>
<button class="px-4 py-1.5 rounded-full font-small-label text-small-label text-on-surface-variant hover:bg-surface-variant transition-colors">1W</button>
<button class="px-4 py-1.5 rounded-full font-small-label text-small-label text-on-surface-variant hover:bg-surface-variant transition-colors">1M</button>
<button class="px-4 py-1.5 rounded-full font-small-label text-small-label text-on-surface-variant hover:bg-surface-variant transition-colors">1Y</button>
<button class="px-4 py-1.5 rounded-full font-small-label text-small-label text-on-surface-variant hover:bg-surface-variant transition-colors">ALL</button>
</section>
<!-- Quick Actions (Buy/Sell, Transfer) -->
<section class="flex gap-stack_md mt-stack_sm">
<button class="flex-1 bg-primary-container text-on-primary h-[52px] rounded-[16px] font-button-primary text-button-primary flex items-center justify-center gap-2 shadow-sm hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined text-[20px]">sync_alt</span>
                Buy &amp; Sell
            </button>
<button class="flex-1 bg-surface-container-high text-on-surface h-[52px] rounded-[16px] font-button-primary text-button-primary flex items-center justify-center gap-2 hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[20px]">account_balance</span>
                Transfer
            </button>
</section>
<!-- Assets List -->
<section class="flex flex-col gap-0">
<div class="flex items-center justify-between pb-stack_sm">
<h3 class="font-row-title text-row-title text-on-surface">Your Assets</h3>
<button class="text-on-surface-variant hover:text-on-surface">
<span class="material-symbols-outlined text-[20px]">tune</span>
</button>
</div>
<!-- Asset Row 1 -->
<div class="flex items-center py-stack_md group cursor-pointer">
<div class="w-[40px] h-[40px] rounded-full bg-surface-container-high flex items-center justify-center mr-stack_md overflow-hidden">
<img alt="Crypto Asset Placeholder" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0ui2sIU56gRu4HQt7EYwZR9lhh98ysFIc8xVZ9BPxgM53vSqPmOflIJJLTzXwDNI5YvBkNX24UFRy1BDRuz7pNDuWgCF34aV2mrsoBYCKhAhtytTWwjzCGOUpO_-7Oox6olpDzIOCnggZT6F0NEdDHQCxzOyCiS72Ko993KoQjctJfodZRBGA3Aq3KbhjvZOd5eK3R_kQ6cu1-GnpufRpXdGgIKaZZs2iOPCu3i3IccWSZqlDKflCLUeemj7"/>
</div>
<div class="flex-1 flex flex-col">
<span class="font-row-title text-row-title text-on-surface">Crypto</span>
<span class="font-row-subtitle text-row-subtitle text-on-surface-variant">Bitcoin, Ethereum...</span>
</div>
<div class="flex flex-col items-end">
<span class="font-row-value text-row-value text-on-surface">S$12.45</span>
<span class="font-small-label text-small-label text-primary-container">+0.5%</span>
</div>
</div>
<!-- Hairline Divider -->
<div class="ml-[56px] h-px bg-outline-variant opacity-50"></div>
<!-- Asset Row 2 -->
<div class="flex items-center py-stack_md group cursor-pointer">
<div class="w-[40px] h-[40px] rounded-full bg-surface-container-high flex items-center justify-center mr-stack_md">
<span class="material-symbols-outlined text-[20px] text-on-surface">payments</span>
</div>
<div class="flex-1 flex flex-col">
<span class="font-row-title text-row-title text-on-surface">Cash</span>
<span class="font-row-subtitle text-row-subtitle text-on-surface-variant">SGD</span>
</div>
<div class="flex flex-col items-end">
<span class="font-row-value text-row-value text-on-surface">S$4.13</span>
<span class="font-small-label text-small-label text-on-surface-variant">--</span>
</div>
</div>
</section>
<!-- Referral Card -->
<section class="bg-surface-container-high rounded-[22px] p-stack_lg flex items-center justify-between mb-stack_xl cursor-pointer hover:bg-surface-container-highest transition-colors">
<div class="flex flex-col gap-1">
<span class="font-row-title text-row-title text-on-surface">Refer and earn</span>
<span class="font-row-subtitle text-row-subtitle text-on-surface-variant">Get rewards for inviting friends</span>
</div>
<div class="flex items-center text-primary-container font-small-label text-small-label">
                Invite now <span class="material-symbols-outlined text-[16px] ml-1">arrow_forward</span>
</div>
</section>
</main>
<!-- BottomNavBar (Generated from JSON) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-horizontal_padding pb-safe bg-surface dark:bg-inverse-surface border-t border-outline-variant dark:border-outline h-[75px] md:hidden">
<!-- Tab 1: Home (Active) -->
<button class="flex flex-col items-center justify-center w-full h-full text-primary dark:text-primary-fixed scale-110 hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</button>
<!-- Tab 2: Wallet/History (Inactive) -->
<button class="flex flex-col items-center justify-center w-full h-full text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined">account_balance_wallet</span>
</button>
<!-- Tab 3: Transactions/Swap (Inactive) -->
<button class="flex flex-col items-center justify-center w-full h-full text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined">swap_horiz</span>
</button>
<!-- Tab 4: Profile/Settings (Inactive) -->
<button class="flex flex-col items-center justify-center w-full h-full text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined">person</span>
</button>
</nav>
</body></html>
