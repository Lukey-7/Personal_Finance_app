<header class="flex justify-between items-center w-full px-container-margin h-16 top-0 absolute z-10 border-b border-outline-variant/10 bg-surface">

</div>
<h1 class="font-heading-md text-heading-md font-bold tracking-tight text-primary">Boro</h1>
</div>

</button>

<p class="font-label-sm text-label-sm text-outline uppercase tracking-widest mb-2">Balance</p>
<div class="flex items-baseline justify-center gap-2 mb-1">
<h2 class="font-display-lg text-display-lg text-primary tracking-tight">0.0278</h2>
<span class="font-numeric-data text-numeric-data text-outline">BOR</span>
</div>
<p class="font-body-md text-body-md text-outline">$6.45</p>
</section>
<!-- Progress Card (Bento Style) -->
<section class="soft-panel rounded-xl p-md flex flex-col gap-sm relative overflow-hidden group">
<div class="flex justify-between items-end mb-2">
<h3 class="font-body-lg text-body-lg text-primary font-medium">Allocation</h3>
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="pie_chart">pie_chart</span>
</div>
<!-- Segmented Bar -->
<div class="h-2 w-full rounded-full bg-surface-container-highest flex overflow-hidden">
<div class="h-full bg-primary" style="width: 60%;"></div>
<div class="h-full bg-outline-variant" style="width: 25%;"></div>
<div class="h-full bg-surface-tint opacity-20" style="width: 15%;"></div>
</div>
<!-- Legend -->
<div class="flex justify-between items-center mt-2 w-full">
<div class="flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-primary"></div>
<span class="font-label-sm text-label-sm text-outline uppercase">Available</span>
</div>
<div class="flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-outline uppercase">Staked</span>
</div>
<div class="flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-surface-tint opacity-50"></div>
<span class="font-label-sm text-label-sm text-outline uppercase">Earned</span>
</div>
</div>
</section>
<!-- Price Section -->

<span class="bg-surface-container text-on-surface font-label-sm text-label-sm px-3 py-1.5 rounded-full border border-outline-variant/30 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="trending_up">trending_up</span>
                    +6.00%
                </span>
</div>
</section>

<path class="chart-line" d="M0,80 Q30,70 60,85 T120,60 T180,40 T240,20 T300,10" fill="none" stroke="black" stroke-width="2" vector-effect="non-scaling-stroke"></path>
<circle cx="300" cy="10" fill="black" r="4"></circle>
</svg>
<div class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent opacity-50 pointer-events-none"></div>
</section>
</main>
<!-- Floating Action Bar -->
<div class="fixed bottom-lg left-1/2 -translate-x-1/2 z-50 flex items-center gap-xs px-sm py-xs w-auto min-w-[280px]">
<!-- Back Action -->
<button class="w-12 h-12 rounded-full bg-surface-container-low/90 backdrop-blur-md border border-outline-variant flex items-center justify-center shadow-sm hover:bg-surface-variant/50 transition-colors shrink-0">
<span class="material-symbols-outlined text-secondary" data-icon="arrow_back" style="font-variation-settings: 'wght' 300;">arrow_back</span>

<div class="w-px h-6 bg-outline-variant/30"></div>

<span class="font-label-sm text-label-sm uppercase">Send</span>
<span class="material-symbols-outlined text-[20px] text-on-primary" data-icon="arrow_upward">arrow_upward</span>

</div>
</div>
