</div>

</section>

<section class="grid grid-cols-2 gap-element-gap mb-section-margin">
<div class="bg-surface-container-lowest border-[0.5px] border-outline-variant rounded-DEFAULT p-4 flex flex-col justify-between">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-4">Lifetime Earned</p>
<p class="font-section-header text-section-header text-primary">$0.00</p>
</div>
<div class="bg-surface-container-lowest border-[0.5px] border-outline-variant rounded-DEFAULT p-4 flex flex-col justify-between">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-4">Last 7D</p>
<p class="font-section-header text-section-header text-primary">$0.00</p>
</div>
</section>

<div class="absolute inset-0 bg-gradient-to-br from-[#1a1c1c] to-primary opacity-80 mix-blend-overlay pointer-events-none"></div>

</div>
<p class="font-body-main text-body-main text-outline-variant max-w-[80%]">Boost your APY and unlock exclusive premium tier products.</p>
<button class="bg-on-primary text-primary font-body-main font-semibold px-6 py-2 rounded-full mt-2 hover:bg-surface-container-highest transition-colors">

</div>
</div>
</section>

<div class="flex flex-col gap-element-gap">

<div class="bg-surface-container-lowest border-[0.5px] border-outline-variant rounded-DEFAULT p-5 flex items-center justify-between hover:bg-surface-container-low transition-colors cursor-pointer">

<div class="w-12 h-12 rounded-full bg-[#E5E9F2] flex items-center justify-center">

</div>
