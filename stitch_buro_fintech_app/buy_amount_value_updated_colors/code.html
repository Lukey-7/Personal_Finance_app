</div>
</div>
<!-- Main Input Area -->
<main class="flex-1 flex flex-col px-page-margin pt-section-gap">

<div class="blinking-cursor"></div>
<span class="text-[78px] leading-none tracking-tighter text-outline ml-4 font-normal">GBP</span>

</div>

</div>
</div>

<div class="mt-section-gap">

</div>
<div class="flex-1">
