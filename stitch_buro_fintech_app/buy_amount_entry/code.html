<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Buy Amount Entry</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#fcf8f8",
                        "on-primary-fixed-variant": "#464747",
                        "inverse-primary": "#c7c6c6",
                        "outline-variant": "#c4c7c7",
                        "background": "#fcf8f8",
                        "primary-fixed-dim": "#c7c6c6",
                        "on-error": "#ffffff",
                        "tertiary-container": "#1e1b1b",
                        "primary-container": "#1b1c1c",
                        "tertiary-fixed": "#e8e1e0",
                        "surface-tint": "#5e5e5e",
                        "on-primary-container": "#848483",
                        "on-tertiary-container": "#888382",
                        "on-background": "#1c1b1b",
                        "secondary-fixed-dim": "#b4c5ff",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e5e2e1",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#313030",
                        "surface-bright": "#fcf8f8",
                        "surface-variant": "#e5e2e1",
                        "primary-fixed": "#e3e2e1",
                        "on-surface": "#1c1b1b",
                        "surface-dim": "#ddd9d8",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#fefcff",
                        "secondary-container": "#2469ff",
                        "inverse-on-surface": "#f4f0ef",
                        "on-tertiary-fixed": "#1e1b1b",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#f1edec",
                        "surface-container-low": "#f7f3f2",
                        "on-surface-variant": "#444747",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#003da9",
                        "primary": "#000000",
                        "on-primary-fixed": "#1b1c1c",
                        "secondary-fixed": "#dbe1ff",
                        "tertiary-fixed-dim": "#ccc5c4",
                        "on-tertiary-fixed-variant": "#4a4646",
                        "surface-container-high": "#ebe7e7",
                        "on-secondary-fixed": "#00174c",
                        "secondary": "#0050d7",
                        "outline": "#747878",
                        "tertiary": "#000000"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "48px",
                        "unit": "4px",
                        "gutter": "24px",
                        "xs": "8px",
                        "xl": "80px",
                        "container-margin": "40px",
                        "md": "24px",
                        "sm": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "numeric-data": ["Inter"],
                        "display-xl": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "heading-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                        "numeric-data": ["24px", { "lineHeight": "1.0", "letterSpacing": "-0.055em", "fontWeight": "500" }],
                        "display-xl": ["82px", { "lineHeight": "1.0", "letterSpacing": "-0.04em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["60px", { "lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "600" }],
                        "heading-md": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "-0.01em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #FDFCF9;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col items-center justify-center">
<!-- Mobile Artboard Container -->
<div class="relative w-full max-w-[393px] h-[852px] bg-background shadow-2xl overflow-hidden flex flex-col">
<!-- TopAppBar (Customized for intent: Linear/Transactional) -->
<header class="flex justify-between items-center w-full px-container-margin h-16 mt-[82px]">
<button class="text-on-surface-variant hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<button class="bg-surface-variant text-on-surface-variant font-label-sm text-label-sm px-sm py-[10px] rounded-full flex items-center gap-xs hover:bg-surface-container-high transition-colors">
                One-time order
                <span class="material-symbols-outlined text-[16px]">arrow_drop_down</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center pt-md px-container-margin">
<!-- Segmented Control -->
<div class="flex bg-surface-variant rounded-full p-unit w-[220px] mb-lg relative">
<button class="flex-1 bg-primary text-on-primary font-label-sm text-label-sm py-xs rounded-full shadow-sm z-10 transition-transform active:scale-95">
                    Buy
                </button>
<button class="flex-1 text-on-surface-variant font-label-sm text-label-sm py-xs rounded-full hover:bg-on-primary-container/10 transition-colors">
                    Sell
                </button>
</div>
<!-- Amount Display -->
<div class="flex flex-col items-center mb-xl">
<div class="flex items-baseline justify-center relative">
<span class="font-display-xl text-display-xl text-primary">5</span>
<div class="w-[3px] h-[70px] bg-secondary animate-pulse ml-1 absolute right-[-10px] top-[10px]"></div>
<span class="font-display-lg text-display-lg text-outline ml-xs">SGD</span>
</div>
<div class="flex items-center gap-xs mt-xs text-secondary bg-secondary/10 px-sm py-[6px] rounded-full cursor-pointer hover:bg-secondary/20 transition-colors">
<span class="material-symbols-outlined text-[16px]">swap_vert</span>
<span class="font-label-sm text-label-sm">0.00004884 BTC</span>
</div>
</div>
<!-- Transaction Details (Soft Panels) -->
<div class="w-full bg-surface-container-low rounded-lg p-md flex flex-col relative">
<!-- Connector Line -->
<div class="absolute left-[39px] top-[50px] bottom-[50px] w-[1px] bg-outline-variant/50 z-0"></div>
<!-- Row 1: Pay with -->
<div class="flex items-center gap-sm relative z-10 mb-md cursor-pointer group">
<div class="w-10 h-10 rounded-full bg-surface flex items-center justify-center border border-outline-variant/30 group-hover:border-outline-variant transition-colors">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">account_balance_wallet</span>
</div>
<div class="flex-1">
<div class="font-label-sm text-label-sm text-on-surface-variant mb-[2px]">Pay with</div>
<div class="font-body-md text-body-md text-on-background font-medium">SGD Wallet</div>
</div>
<div class="text-right">
<div class="font-label-sm text-label-sm text-on-surface-variant mb-[2px]">Available</div>
<div class="font-body-md text-body-md text-on-background">S$5.00</div>
</div>
</div>
<!-- Row 2: Buy -->
<div class="flex items-center gap-sm relative z-10 cursor-pointer group pt-sm border-t border-outline-variant/20">
<div class="w-10 h-10 rounded-full bg-surface flex items-center justify-center border border-outline-variant/30 overflow-hidden group-hover:border-outline-variant transition-colors">
<img alt="Placeholder image for bitcoin icon" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0ui2sIU56gRu4HQt7EYwZR9lhh98ysFIc8xVZ9BPxgM53vSqPmOflIJJLTzXwDNI5YvBkNX24UFRy1BDRuz7pNDuWgCF34aV2mrsoBYCKhAhtytTWwjzCGOUpO_-7Oox6olpDzIOCnggZT6F0NEdDHQCxzOyCiS72Ko993KoQjctJfodZRBGA3Aq3KbhjvZOd5eK3R_kQ6cu1-GnpufRpXdGgIKaZZs2iOPCu3i3IccWSZqlDKflCLUeemj7"/>
</div>
<div class="flex-1">
<div class="font-label-sm text-label-sm text-on-surface-variant mb-[2px]">Buy</div>
<div class="font-body-md text-body-md text-on-background font-medium">Bitcoin</div>
</div>
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">chevron_right</span>
</div>
</div>
</main>
<!-- Fixed Bottom Area -->
<div class="w-full px-container-margin pb-md bg-background/90 backdrop-blur-md">
<!-- Review Order Button -->
<button class="w-full bg-secondary text-on-secondary h-[56px] rounded-[29px] font-label-sm text-label-sm tracking-wide hover:opacity-90 active:scale-95 transition-all mb-lg">
                Review order
            </button>
<!-- Numeric Keypad -->
<div class="grid grid-cols-3 gap-y-xs gap-x-sm mb-lg">
<button class="font-numeric-data text-numeric-data text-on-background h-12 hover:bg-surface-variant/50 rounded-lg active:scale-95 transition-all">1</button>
<button class="font-numeric-data text-numeric-data text-on-background h-12 hover:bg-surface-variant/50 rounded-lg active:scale-95 transition-all">2</button>
<button class="font-numeric-data text-numeric-data text-on-background h-12 hover:bg-surface-variant/50 rounded-lg active:scale-95 transition-all">3</button>
<button class="font-numeric-data text-numeric-data text-on-background h-12 hover:bg-surface-variant/50 rounded-lg active:scale-95 transition-all">4</button>
<button class="font-numeric-data text-numeric-data text-on-background h-12 hover:bg-surface-variant/50 rounded-lg active:scale-95 transition-all">5</button>
<button class="font-numeric-data text-numeric-data text-on-background h-12 hover:bg-surface-variant/50 rounded-lg active:scale-95 transition-all">6</button>
<button class="font-numeric-data text-numeric-data text-on-background h-12 hover:bg-surface-variant/50 rounded-lg active:scale-95 transition-all">7</button>
<button class="font-numeric-data text-numeric-data text-on-background h-12 hover:bg-surface-variant/50 rounded-lg active:scale-95 transition-all">8</button>
<button class="font-numeric-data text-numeric-data text-on-background h-12 hover:bg-surface-variant/50 rounded-lg active:scale-95 transition-all">9</button>
<button class="font-numeric-data text-numeric-data text-on-background h-12 hover:bg-surface-variant/50 rounded-lg active:scale-95 transition-all">.</button>
<button class="font-numeric-data text-numeric-data text-on-background h-12 hover:bg-surface-variant/50 rounded-lg active:scale-95 transition-all">0</button>
<button class="flex items-center justify-center text-on-background h-12 hover:bg-surface-variant/50 rounded-lg active:scale-95 transition-all">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
<!-- iOS Home Indicator -->
<div class="w-[134px] h-[5px] bg-on-background rounded-full mx-auto mt-xs"></div>
</div>
</div>
</body></html>
